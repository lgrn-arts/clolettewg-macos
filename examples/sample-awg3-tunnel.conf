# Sample AWG 1.5/3.0-generation tunnel for awgd / AwgClient.app.
#
# Same file format the AmneziaVPN app exports. Everything below uses
# EXAMPLE keys — replace them with your own server's values. Classic
# (AWG 1.0) profiles with only Jc/Jmin/Jmax/S1/S2/H1..H4 work unchanged.

[Interface]
PrivateKey = oNgQZWdGFjnoE14AbJWdCiF50AXUFpD5xHxxgljAw3E=
Address = 10.46.20.66/32
DNS = 1.1.1.1, 8.8.8.8
MTU = 1280

# --- classic obfuscation parameters ---
Jc = 9
Jmin = 30
Jmax = 90
S1 = 110
S2 = 120

# --- AWG 1.5/3.0 parameters ---
# extra prefix paddings for cookie/transport datagrams
S3 = 47
S4 = 23
# magic header ranges (lo-hi); plain numbers also accepted
H1 = 7291435-486117520
H2 = 602843917-1157629843
H3 = 1249871566-1680354947
H4 = 1781926002-2106438100
# junk datagrams sent before each handshake initiation, spec DSL:
#   b 0x… = literal bytes, r N = N random bytes, d/rc/rd/ds/dz = copies
I1 = <b 0x0003><r 2><b 0x2112A442><r 12><r 20>
I2 = <b 0x0103><r 2><b 0x2112A442><r 12><r 24>
I3 = <b 0x0008><r 2><b 0x2112A442><r 12><r 16>
# header protection: whole message ChaCha20-XORed (key = 32 bytes base64)
HeaderProtectionKey = t5BBswOFBGXdov39u/Xv9obDe+GBtOrbepoXRmgrdQs=
# per-packet random content padding, bytes
ContentPaddingAddition = 50-200

# --- timer overrides (seconds) ---
RekeyAfterTime = 120
RekeyTimeout = 5
RejectAfterTime = 180
KeepaliveTimeout = 25
MaxHandshakeAttempts = 5

[Peer]
PublicKey = Zk5Y2qZL1Jh7dEBWHPIhGkF3LbQorPkvDosmfbGnN3A=
PresharedKey = QHhGMTvSYHmNg9CVJhqWzGVMiCL1pTt8N0DkI6bCk2g=
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 25
Endpoint = vpn.example.com:51820
